name: Build & Deploy Android App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test Android App (Debug Signed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment (.env)
        run: |
          echo "Setting up .env file..."
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Restore Debug Keystore
        run: |
          echo "Restoring debug signing keystore..."
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restored from base64."
          else
            echo "debug.keystore.base64 not found, generating default debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable (if present)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew testDebugUnitTest --continue --no-daemon
          else
            gradle testDebugUnitTest --continue --no-daemon
          fi

      - name: Build Debug APK (Signed with Debug Key)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate Built APKs
        id: find_apks
        run: |
          echo "Locating built APK files..."
          find app/build/outputs/apk/ -name "*.apk" || true
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found debug APK at: $APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocalkeep-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: Create GitHub Release and Deploy APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "Release ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          body: |
            ## VocalKeep Player - Debug Signed Build
            Automated CI/CD build with on-device vocal isolation capabilities.
            
            ### Artifacts Included:
            - Debug Signed APK: Ready to install on Android devices (API 24+)
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
